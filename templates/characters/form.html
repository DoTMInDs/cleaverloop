{% extends 'base.html' %}

{% block title %}Create Character — CleverLoop AI{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-heading font-extrabold text-white">Create Reusable Character</h1>
        <p class="text-xs text-slate-400 mt-1">Define appearance traits injected into prompts for character consistency.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="glass-panel rounded-3xl p-6 md:p-8 space-y-5">
        {% csrf_token %}

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Character Name</label>
            <input type="text" name="name" required placeholder="e.g. Maya Chen"
                   class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500">
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Appearance Description (Facial & Physical Traits)</label>
            <textarea name="appearance_description" rows="3" required
                      placeholder="e.g. 28-year-old Asian woman, sharp jawline, warm hazel eyes, sleek raven shoulder-length hair, athletic build"
                      class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500 resize-none"></textarea>
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Clothing & Wardrobe Style</label>
            <input type="text" name="clothing_description"
                   placeholder="e.g. Cyberpunk dark leather bomber jacket with teal neon inner lining"
                   class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500">
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Personality / Expression</label>
            <input type="text" name="personality"
                   placeholder="e.g. Confident, focused, slight smirk, intense gaze"
                   class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500">
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Character Avatar / Face Reference</label>
            <input type="file" name="avatar" accept="image/*"
                   class="file-input file-input-bordered file-input-sm w-full bg-surface border-white/10 text-xs text-slate-300">
        </div>

        <div class="pt-4 border-t border-white/10 flex items-center justify-end gap-3">
            <a href="{% url 'characters:list' %}" class="btn btn-ghost btn-sm text-xs">Cancel</a>
            <button type="submit" class="btn btn-primary btn-sm bg-brand-600 hover:bg-brand-500 border-none text-white px-6">
                Save Character
            </button>
        </div>
    </form>
</div>
{% endblock %}
