{% extends 'base.html' %}

{% block title %}New Project — CleaverLoop AI{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-heading font-extrabold text-white">Create New Project</h1>
        <p class="text-xs text-slate-400 mt-1">Set up a container for your multi-scene video storyboard.</p>
    </div>

    <form method="POST" class="glass-panel rounded-3xl p-6 md:p-8 space-y-5">
        {% csrf_token %}

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Project Name</label>
            <input type="text" name="name" required placeholder="e.g. ServInk Commercial Ad"
                   class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500">
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Description</label>
            <textarea name="description" rows="3" placeholder="Brief summary of this video production..."
                      class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500 resize-none"></textarea>
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Target Aspect Ratio</label>
            <select name="aspect_ratio" class="w-full rounded-xl bg-surface border border-white/10 text-xs text-white px-3 py-2.5 outline-none focus:border-brand-500">
                <option value="16:9">16:9 Landscape (YouTube / Widescreen)</option>
                <option value="9:16">9:16 Portrait (TikTok / Instagram Reels)</option>
                <option value="1:1">1:1 Square (Social Feed)</option>
            </select>
        </div>

        <div class="pt-4 border-t border-white/10 flex items-center justify-end gap-3">
            <a href="{% url 'projects:list' %}" class="btn btn-ghost btn-sm text-xs">Cancel</a>
            <button type="submit" class="btn btn-primary btn-sm bg-brand-600 hover:bg-brand-500 border-none text-white px-6">
                Create Project & Storyboard
            </button>
        </div>
    </form>
</div>
{% endblock %}
