{% extends 'base.html' %}

{% block title %}Sign In — CleverLoop AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 space-y-6">
    <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-400 p-[1px] shadow-xl shadow-brand-500/20 mx-auto flex items-center justify-center">
            <div class="w-full h-full bg-obsidian rounded-[15px] flex items-center justify-center">
                <span class="text-xl">✨</span>
            </div>
        </div>
        <h1 class="text-2xl font-heading font-extrabold text-white">Welcome Back</h1>
        <p class="text-xs text-slate-400">Sign in to your CleverLoop creative studio</p>
    </div>

    <form method="POST" class="glass-panel-glow rounded-3xl p-6 md:p-8 space-y-4">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="p-3 bg-rose-500/20 text-rose-200 rounded-xl text-xs">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Email Address</label>
            <input type="email" name="username" required autofocus placeholder="creator@cleverloop.ai"
                   class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500">
        </div>

        <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full rounded-xl bg-surface border border-white/10 text-sm text-white px-4 py-2.5 outline-none focus:border-brand-500">
        </div>

        <button type="submit" class="btn btn-primary w-full bg-brand-600 hover:bg-brand-500 border-none text-white shadow-lg shadow-brand-500/30 text-sm font-bold mt-2">
            Sign In
        </button>

        <div class="text-center pt-2">
            <span class="text-xs text-slate-400">New creator?</span>
            <a href="{% url 'accounts:register' %}" class="text-xs font-bold text-brand-400 hover:text-brand-300 ml-1">Create Account →</a>
        </div>
    </form>
</div>
{% endblock %}
