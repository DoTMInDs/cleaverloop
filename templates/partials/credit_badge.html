<a href="{% url 'pricing' %}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 hover:bg-orange-500/10 border border-white/10 hover:border-orange-500/30 text-xs font-semibold text-slate-200 transition group shadow-inner">
    {% if user_wallet and user_wallet.is_unlimited_eligible %}
        <span class="text-orange-400 font-bold text-xs">✨</span>
        <span class="text-white font-extrabold font-mono tracking-tight">{{ user_wallet.formatted_balance|default:"400K" }}</span>
        <span class="text-[10px] px-1.5 py-0.2 rounded bg-orange-500/20 text-orange-300 font-mono font-bold uppercase">Unlimited</span>
    {% else %}
        <span class="text-amber-400 font-bold text-xs">⚡</span>
        <span class="text-white font-extrabold font-mono tracking-tight">{{ user_wallet.formatted_balance|default:credit_balance|default:"500" }}</span>
        <span class="text-slate-400 text-[10px] uppercase tracking-wider font-mono">CR</span>
    {% endif %}
</a>
